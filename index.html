<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>Smart Chess</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:#111827;
  color:white;
  font-family:Arial,sans-serif;
  text-align:center;
}

.app{
  width:min(100%,520px);
  margin:auto;
  padding:18px 10px;
}

h1{
  margin:5px 0;
  font-size:30px;
}

.status{
  margin:10px 0;
  font-weight:bold;
}

.controls{
  display:flex;
  justify-content:center;
  gap:8px;
  margin:12px 0;
}

button,select{
  border:0;
  border-radius:9px;
  padding:10px 14px;
  font-size:15px;
  font-weight:bold;
}

button{
  background:#2563eb;
  color:white;
}

.board{
  width:min(96vw,500px);
  aspect-ratio:1;
  margin:auto;
  display:grid;
  grid-template-columns:repeat(8,1fr);
  border:4px solid #374151;
  border-radius:8px;
  overflow:hidden;
}

.square{
  display:flex;
  justify-content:center;
  align-items:center;
  font-size:clamp(30px,10vw,58px);
  user-select:none;
}

.light{
  background:#f0d9b5;
}

.dark{
  background:#b58863;
}

.selected{
  outline:4px solid #22c55e;
  outline-offset:-4px;
}

.legal{
  box-shadow:inset 0 0 0 5px rgba(34,197,94,.45);
}

.info{
  color:#9ca3af;
  font-size:13px;
  margin-top:12px;
}
</style>
</head>

<body>

<div class="app">

<h1>♟️ Smart Chess</h1>

<div class="controls">

<select id="difficulty">
<option value="easy">Easy AI</option>
<option value="medium">Medium AI</option>
</select>

<button onclick="newGame()">New Game</button>

</div>

<div id="status" class="status">
White's turn
</div>

<div id="board" class="board"></div>

<div class="info">
You are White • Tap a piece, then tap its destination
</div>

</div>

<script>

const pieces = {

K:"♔",
Q:"♕",
R:"♖",
B:"♗",
N:"♘",
P:"♙",

k:"♚",
q:"♛",
r:"♜",
b:"♝",
n:"♞",
p:"♟"

};

const initialBoard = [

["r","n","b","q","k","b","n","r"],

["p","p","p","p","p","p","p","p"],

["","","","","","","",""],

["","","","","","","",""],

["","","","","","","",""],

["","","","","","","",""],

["P","P","P","P","P","P","P","P"],

["R","N","B","Q","K","B","N","R"]

];

let board;
let turn;
let selected;
let gameOver;
let thinking;

function newGame(){

board = initialBoard.map(row => row.slice());

turn = "white";

selected = null;

gameOver = false;

thinking = false;

render();

}

function pieceColor(piece){

if(!piece) return null;

return piece === piece.toUpperCase()
? "white"
: "black";

}

function inside(row,col){

return row >= 0 &&
       row < 8 &&
       col >= 0 &&
       col < 8;

}

function getMoves(row,col){

const piece = board[row][col];

if(!piece) return [];

const type = piece.toUpperCase();

const color = pieceColor(piece);

const moves = [];

function addMove(r,c){

if(!inside(r,c)) return false;

if(!board[r][c]){

moves.push([r,c]);

return true;

}

if(pieceColor(board[r][c]) !== color){

moves.push([r,c]);

}

return false;

}

if(type === "P"){

const direction = color === "white" ? -1 : 1;

const startRow = color === "white" ? 6 : 1;

if(
inside(row+direction,col) &&
!board[row+direction][col]
){

moves.push([
row+direction,
col
]);

if(
row === startRow &&
!board[row+2*direction][col]
){

moves.push([
row+2*direction,
col
]);

}

}

for(const dc of [-1,1]){

const r = row + direction;
const c = col + dc;

if(
inside(r,c) &&
board[r][c] &&
pieceColor(board[r][c]) !== color
){

moves.push([r,c]);

}

}

}

else if(type === "N"){

const jumps = [

[-2,-1],[-2,1],
[-1,-2],[-1,2],
[1,-2],[1,2],
[2,-1],[2,1]

];

for(const [dr,dc] of jumps){

addMove(
row+dr,
col+dc
);

}

}

else if(type === "K"){

for(let dr=-1;dr<=1;dr++){

for(let dc=-1;dc<=1;dc++){

if(dr !== 0 || dc !== 0){

addMove(
row+dr,
col+dc
);

}

}

}

}

else{

let directions = [];

if(type === "B" || type === "Q"){

directions.push(
[-1,-1],
[-1,1],
[1,-1],
[1,1]
);

}

if(type === "R" || type === "Q"){

directions.push(
[-1,0],
[1,0],
[0,-1],
[0,1]
);

}

for(const [dr,dc] of directions){

let r = row + dr;
let c = col + dc;

while(
inside(r,c)
){

if(!addMove(r,c)) break;

r += dr;
c += dc;

}

}

}

return moves;

}

function makeMove(
fromRow,
fromCol,
toRow,
toCol
){

const piece =
board[fromRow][fromCol];

board[toRow][toCol] = piece;

board[fromRow][fromCol] = "";

if(
piece === "P" &&
toRow === 0
){

board[toRow][toCol] = "Q";

}

if(
piece === "p" &&
toRow === 7
){

board[toRow][toCol] = "q";

}

turn =
turn === "white"
? "black"
: "white";

}

function playerClick(row,col){

if(gameOver || thinking) return;

if(turn !== "white") return;

const piece = board[row][col];

if(selected){

const [sr,sc] = selected;

const moves = getMoves(sr,sc);

const valid =
moves.some(
m => m[0] === row &&
     m[1] === col
);

if(valid){

makeMove(
sr,
sc,
row,
col
);

selected = null;

render();

if(!checkGameOver()){

computerMove();

}

return;

}

selected = null;

}

if(
piece &&
pieceColor(piece) === "white"
){

selected = [row,col];

}

render();

}

function computerMove(){

thinking = true;

render();

setTimeout(()=>{

const moves = [];

for(let r=0;r<8;r++){

for(let c=0;c<8;c++){

const piece = board[r][c];

if(
piece &&
pieceColor(piece) === "black"
){

for(
const [tr,tc]
of getMoves(r,c)
){

moves.push([
r,c,tr,tc
]);

}

}

}

}

if(moves.length === 0){

gameOver = true;

thinking = false;

render();

return;

}

let chosen;

const difficulty =
document.getElementById(
"difficulty"
).value;

if(difficulty === "easy"){

chosen =
moves[
Math.floor(
Math.random()*moves.length
)
];

}

else{

let captures =
moves.filter(
m => board[m[2]][m[3]]
);

chosen =
captures.length
? captures[
Math.floor(
Math.random()*captures.length
)
]
: moves[
Math.floor(
Math.random()*moves.length
)
];

}

makeMove(
chosen[0],
chosen[1],
chosen[2],
chosen[3]
);

thinking = false;

render();

checkGameOver();

},500);

}

function checkGameOver(){

const whiteKing =
board.flat().includes("K");

const blackKing =
board.flat().includes("k");

if(!whiteKing || !blackKing){

gameOver = true;

document.getElementById(
"status"
).textContent =
"Game Over";

render();

return true;

}

return false;

}

function render(){

const boardElement =
document.getElementById("board");

boardElement.innerHTML = "";

const status =
document.getElementById("status");

if(gameOver){

status.textContent =
"Game Over — New Game दबाएँ";

}

else if(thinking){

status.textContent =
"Computer सोच रहा है...";

}

else if(turn === "white"){

status.textContent =
"आपकी चाल — White";

}

else{

status.textContent =
"Computer की चाल — Black";

}

for(let r=0;r<8;r++){

for(let c=0;c<8;c++){

const square =
document.createElement("div");

square.className =
"square " +
(
(r+c)%2
? "dark"
: "light"
);

if(
selected &&
selected[0] === r &&
selected[1] === c
){

square.classList.add(
"selected"
);

}

if(selected){

const moves =
getMoves(
selected[0],
selected[1]
);

if(
moves.some(
m => m[0] === r &&
     m[1] === c
)
){

square.classList.add(
"legal"
);

}

}

square.textContent =
pieces[
board[r][c]
] || "";

square.onclick =
() => playerClick(r,c);

boardElement.appendChild(
square
);

}

}

}

newGame();

</script>

</body>
</html>
